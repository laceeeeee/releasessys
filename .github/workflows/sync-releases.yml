name: Sync Upstream Releases

on:
  workflow_dispatch:
  repository_dispatch:
    types: [remote-cron-trigger]

permissions:
  contents: write

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync releases from upstream
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const upstreamOwner = 'hdbjlizhe';
            const upstreamRepo = 'fanli';

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workDir = path.join(process.cwd(), 'release-assets');
            if (!fs.existsSync(workDir)) {
              fs.mkdirSync(workDir, { recursive: true });
            }

            function safeName(name) {
              return String(name).replace(/[<>:"/\\|?*\x00-\x1F]/g, '_');
            }

            async function listAllReleases(owner, repo) {
              return await github.paginate(
                github.rest.repos.listReleases,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );
            }

            async function findReleaseByTag(owner, repo, tag) {
              try {
                const res = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag
                });
                return res.data;
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }

            async function createOrUpdateRelease(upstreamRelease) {
              const tag = upstreamRelease.tag_name;
              const existing = await findReleaseByTag(owner, repo, tag);

              const releaseName = upstreamRelease.name || tag;
              const releaseBody = upstreamRelease.body || '';
              const prerelease = !!upstreamRelease.prerelease;

              if (!existing) {
                core.info(`Creating release: ${tag}`);
                const created = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: releaseName,
                  body: releaseBody,
                  draft: false,
                  prerelease
                });
                return created.data;
              }

              const needUpdate =
                existing.name !== releaseName ||
                (existing.body || '') !== releaseBody ||
                !!existing.prerelease !== prerelease ||
                !!existing.draft !== false;

              if (!needUpdate) {
                core.info(`Release unchanged: ${tag}`);
                return existing;
              }

              core.info(`Updating release metadata: ${tag}`);
              const updated = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.id,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease
              });
              return updated.data;
            }

            async function listReleaseAssets(owner, repo, release_id) {
              return await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner,
                  repo,
                  release_id,
                  per_page: 100
                }
              );
            }

            async function deleteReleaseAsset(assetId, assetName) {
              core.info(`Deleting old asset: ${assetName}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: assetId
              });
            }

            function downloadFile(url, outputPath) {
              core.info(`Downloading asset: ${url}`);
              try {
                execSync(
                  `curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 15 ` +
                  `-H "Accept: application/octet-stream" ` +
                  `"${url}" -o "${outputPath}"`,
                  { stdio: 'inherit' }
                );
              } catch (err) {
                core.error(`Download failed after retries: ${url}`);
                throw err;
              }
            }

            function uploadAsset(uploadUrl, filePath, assetName, contentType) {
              core.info(`Uploading asset: ${assetName}`);
              const stat = fs.statSync(filePath);
              const cleanUploadUrl = uploadUrl.replace(/\{.*$/, '');

              execSync(
                `curl -L --fail ` +
                `-X POST ` +
                `-H "Authorization: Bearer ${process.env.GITHUB_TOKEN}" ` +
                `-H "Content-Type: ${contentType}" ` +
                `-H "Content-Length: ${stat.size}" ` +
                `--data-binary @"${filePath}" ` +
                `"${cleanUploadUrl}?name=${encodeURIComponent(assetName)}"`,
                { stdio: 'inherit' }
              );
            }

            function isAssetSame(targetAsset, upstreamAsset) {
              if (!targetAsset) return false;

              const sameName = targetAsset.name === upstreamAsset.name;
              const sameSize = Number(targetAsset.size || 0) === Number(upstreamAsset.size || 0);
              const sameContentType =
                String(targetAsset.content_type || 'application/octet-stream') ===
                String(upstreamAsset.content_type || 'application/octet-stream');

              return sameName && sameSize && sameContentType;
            }

            async function syncAssets(upstreamRelease, targetRelease) {
              const upstreamAssets = upstreamRelease.assets || [];
              if (!upstreamAssets.length) {
                core.info(`No assets for release ${upstreamRelease.tag_name}`);
                return;
              }

              const targetAssets = await listReleaseAssets(owner, repo, targetRelease.id);

              for (const asset of upstreamAssets) {
                const assetName = asset.name;
                const safeAssetName = safeName(assetName);
                const safeTag = safeName(upstreamRelease.tag_name);
                const outputPath = path.join(workDir, `${safeTag}-${safeAssetName}`);
                const contentType = asset.content_type || 'application/octet-stream';

                const existing = targetAssets.find(a => a.name === assetName);

                if (isAssetSame(existing, asset)) {
                  core.info(`Skipping unchanged asset: ${assetName}`);
                  continue;
                }

                if (existing) {
                  await deleteReleaseAsset(existing.id, existing.name);
                }

                try {
                  downloadFile(asset.browser_download_url, outputPath);
                  uploadAsset(targetRelease.upload_url, outputPath, assetName, contentType);
                } finally {
                  if (fs.existsSync(outputPath)) {
                    fs.unlinkSync(outputPath);
                  }
                }

                // 文件间稍微停顿，防止触发网络限制
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }

            async function main() {
              core.info(`Upstream repo: ${upstreamOwner}/${upstreamRepo}`);
              core.info(`Target repo: ${owner}/${repo}`);

              const upstreamReleases = await listAllReleases(upstreamOwner, upstreamRepo);
              core.info(`Found ${upstreamReleases.length} upstream releases`);

              // 从旧到新处理，保证最新 release 最后同步
              const sortedReleases = [...upstreamReleases].reverse();

              for (const upstreamRelease of sortedReleases) {
                const tag = upstreamRelease.tag_name || '(no-tag)';

                if (upstreamRelease.draft) {
                  core.info(`Skipping draft release: ${tag}`);
                  continue;
                }

                core.info(`Processing release: ${tag}`);
                const targetRelease = await createOrUpdateRelease(upstreamRelease);
                await syncAssets(upstreamRelease, targetRelease);
              }

              core.info('Release sync completed.');
            }

            await main();
